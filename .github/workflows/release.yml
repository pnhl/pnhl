name: 🚀 Camera Gold Release Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.0)'
        required: true
        default: 'v1.1.0'

jobs:
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 📋 Extract Release Info
      id: release_info
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "release_name=Camera Gold ${VERSION}" >> $GITHUB_OUTPUT
        
    - name: 🏷️ Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_info.outputs.version }}
        release_name: ${{ steps.release_info.outputs.release_name }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
        
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.release_info.outputs.version }}
      
  upload-apk:
    name: 📱 Upload APK Assets
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 📱 Check APK Files
      run: |
        echo "Looking for APK files..."
        find . -name "*.apk" -type f -ls || echo "No APK files found"
        
    - name: 📤 Upload v1.1 Official APK
      if: hashFiles('**/CameraGold-v1.1-Official.apk') != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./CameraGold-v1.1-Official.apk
        asset_name: CameraGold-v1.1-Official.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: 📤 Upload v1.0 APK
      if: hashFiles('**/CameraGold-v1.0.apk') != ''
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./CameraGold-v1.0.apk
        asset_name: CameraGold-v1.0.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: 📄 Upload APK Info
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./CameraGold-APK-Info.md
        asset_name: CameraGold-APK-Info.md
        asset_content_type: text/markdown

  notify:
    name: 📢 Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, upload-apk]
    
    steps:
    - name: 🎉 Release Summary
      run: |
        echo "🚀 Camera Gold ${{ needs.create-release.outputs.version }} Released!"
        echo "📱 APK files uploaded to GitHub Releases"
        echo "🔗 Download URL: https://github.com/pnhl/pnhl/releases/tag/${{ needs.create-release.outputs.version }}"
